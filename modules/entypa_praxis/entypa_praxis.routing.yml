entypa_praxis.ajax_protocollo:
  path: '/entypa-praxis/ajax-protocollo'
  defaults:
    _controller: '\Drupal\entypa_praxis\Form\EntypaPraxisInlineForm::ajaxProtocolloEndpoint'
  requirements:
    _permission: 'protocollato'
  methods: [POST]

# I testi lunghi si leggono in una finestra, non in colonna. Il permesso è in
# OR: chiunque partecipi all'istruttoria deve poterli leggere.
entypa_praxis.motivo:
  path: '/entypa-praxis/motivo/{tipo}/{id}'
  defaults:
    _controller: '\Drupal\entypa_praxis\Controller\MotivoController::mostra'
    _title_callback: '\Drupal\entypa_praxis\Controller\MotivoController::titolo'
  requirements:
    _permission: 'amministra istanze+protocollato+visto dsga+visto referente+visto+acquisito+annullato'
    tipo: 'istruttoria|annullamento'
    id: \d+
  options:
    _admin_route: TRUE

