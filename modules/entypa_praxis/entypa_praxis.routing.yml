entypa_praxis.settings:
  path: '/admin/config/system/entypa-praxis'
  defaults:
    _form: '\Drupal\entypa_praxis\Form\EntypaPraxisSettingsForm'
    _title: 'Entýpa — Istruttoria delle istanze'
  requirements:
    _permission: 'amministra istanze'

# I percorsi sono annidati sotto «praxis» per non accavallarsi con quelli del
# vecchio modulo finché i due convivono: nessuno li digita a mano, i collegamenti
# sono generati dai plugin Views per nome di rotta.
entypa_praxis.acquisisci:
  path: '/node/{node}/submission/{submission}/praxis/acquisisci/{tid}'
  defaults:
    _form: '\Drupal\entypa_praxis\Form\EntypaPraxisReasonsForm'
    _title: 'Acquisisci istanza'
    field: 'acquisito'
  requirements:
    _permission: 'acquisito'
    node: \d+
    submission: \d+
    tid: \d+
  options:
    # Pagina di lavoro della segreteria: va vestita con il tema di
    # amministrazione, come faceva hook_admin_paths() in Drupal 7.
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

