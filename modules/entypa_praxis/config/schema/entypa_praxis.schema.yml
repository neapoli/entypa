  label: 'Concedibile'

views.field.entypa_praxis_modifica:
  type: views_field
  label: 'Modifica'

views.field.entypa_praxis_motivazioni:
  type: views_field
  label: 'Motivazioni'

views.field.entypa_praxis_protocollo:
  type: views_field
  label: 'Protocollo'

views.field.entypa_praxis_richiesta_annullamento:
  type: views_field
  label: 'Richiesta di annullamento'

views.field.entypa_praxis_visto:
  type: views_field
  label: 'Visto del dirigente'

views.field.entypa_praxis_visto_dsga:
  type: views_field
  label: 'Visto del DSGA'

views.field.entypa_praxis_visto_referente:
  type: views_field
  label: 'Visto del referente'

views.filter.entypa_praxis_annullato_data_filter:
  type: views.filter.boolean
  label: 'Annullata'

views.filter.entypa_praxis_evaso_data:
