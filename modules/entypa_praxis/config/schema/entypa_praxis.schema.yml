entypa_praxis.settings:
  type: config_object
  label: "Impostazioni dell'istruttoria delle istanze"
  mapping:
    node_types:
      type: sequence
      label: 'Node types'
      sequence:
        type: string
        label: 'Node type'
    oe:
      type: boolean
      label: 'Operatori economici mode'
    email:
      type: email
      label: 'Secretary email'
    notification_email:
      type: boolean
      label: 'Send notification email to secretary'
    notification_body:
      type: text
      label: 'Notification body'
    segreteria_subject:
      type: string
      label: 'Secretary email subject'
    segreteria_body:
      type: text
      label: 'Secretary email body'
    annullata_subject:
      type: string
      label: "Oggetto dell'email di istanza annullata"
    annullata_body:
      type: text
      label: "Testo dell'email di istanza annullata"
    notification_footer:
      type: text
      label: 'Notification footer'
    evaded_signature:
      type: boolean
      label: "Allega la segnatura di protocollo all'email di istanza evasa"

# Plugin Views del modulo. Nessuno aggiunge opzioni proprie: ciascuno prende
# lo schema del plugin del core da cui deriva, così la vista si valida per
# intero e le opzioni ereditate (per esempio il formato della data) sono
# descritte.
views.field.entypa_praxis_annullato_data:
  type: views.field.date
  label: 'Istanza annullata il'

views.field.entypa_praxis_concedibile:
