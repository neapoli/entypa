          plugin_id: text
          empty: true
          content:
            value: "<details class=\"entypa-praxis-istruzioni\">\n<summary>Come si lavora un'istanza inviata</summary>\n<ul>\n  <li>Cliccando su <strong>MOSTRA</strong> si aprirà un pop-up dove sarà possibile vedere l'istanza ricevuta.</li>\n  <li>Dopo aver attivato il <strong>Protocollo</strong>, si potrà verificare se l'Istanza è concedibile oppure no, cliccando sul testo «da verificare» nel campo Verifica Ufficio.\n    <ul>\n      <li><strong>In caso positivo</strong> l'istanza passerà alla firma del DSGA e/o del DS, che le trovano raccolte nelle schede <strong>Firma DSGA</strong> e <strong>Firma DS</strong>.\n        <ul>\n          <li>Dopo la valutazione del DSGA e/o del DS l'istanza passerà nella scheda <strong>EVASE</strong>.</li>\n          <li>Verrà inviata una mail all'utente con <strong>messaggio di conferma</strong> dell'avvenuta accettazione dell'Istanza.</li>\n        </ul>\n      </li>\n      <li><strong>In caso negativo</strong>, bisognerà inserire le motivazioni e l'istanza passerà nella scheda <strong>EVASE</strong>.\n        <ul>\n          <li>Verrà inviata una mail all'utente con <strong>messaggio di NON conferma</strong> dell'avvenuta accettazione dell'Istanza.</li>\n          <li>Le motivazioni restano consultabili dal pulsante <strong>Motivazioni</strong> e vengono mostrate al dipendente insieme alla sua istanza.</li>\n        </ul>\n      </li>\n    </ul>\n  </li>\n  <li>Se il dipendente chiede l'annullamento, nella colonna <strong>Ritiro</strong> compare un orologio arancio e il pulsante <strong>Motivo</strong> ne mostra la ragione.\n    <ul>\n      <li>Premendo <strong>Annulla</strong> l'istanza viene annullata, l'utente avvisato per mail e la riga passa nella scheda <strong>ANNULLATE</strong>.</li>\n      <li>Proseguendo invece con la lavorazione, la richiesta resta registrata come non accolta.</li>\n    </ul>\n  </li>\n</ul>\n</details>"
            format: bootstrap_italia_2
          tokenize: false
      display_extenders: {  }
      path: admin/entypa-praxis/inviate
      menu:
