          content:
            value: "<h3>Gestione Istanze Inviate</h3>\r\n<ul>\r\n<li>Cliccando su <strong>MOSTRA</strong> si aprirà un pop-up dove sarà possibile vedere l'istanza ricevuta.</li>\r\n<li>Dopo aver messo il <strong>check su Protocollo</strong>, si potrà verificare se l'Istanza è concedibile oppure no, cliccando sul testo \"da verificare\" nel campo Verifica Ufficio</li>\r\n   <ul>\r\n   <li><strong>In caso positivo</strong> l'istanza passerà alla firma del DSGA e/o del DS</li>\r\n      <ul>\r\n      <li>Dopo la valutazione del DSGA e/o del DS l'istanza passerà nella scheda EVASE</li>\r\n      <li>Verrà inviata una mail all'utente con <strong>messaggio di conferma</strong> dell'avvenuta accettazione dell'Istanza.</li>\r\n      </ul>\r\n   <li><strong>In caso negativo</strong>, bisognerà inserire le motivazioni e l'istanza passerà nella scheda EVASE</li>\r\n   <li>Verrà inviata una mail all'utente con <strong>messaggio di NON conferma</strong> dell'avvenuta accettazione dell'Istanza.</li>\r\n   </ul>\r\n</ul>"
