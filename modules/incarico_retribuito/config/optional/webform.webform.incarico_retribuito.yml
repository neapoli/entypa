  webform_entity_print:
    template:
      header: '<h2>Autorizzazione allo svolgimento di incarico retribuito</h2>'
      footer: ''
      css: ''
    export_types:
      pdf:
        enabled: true
        link_text: ''
        link_attributes: {  }
weight: 0
open: null
close: null
uid: 1
template: false
archive: false
id: incarico_retribuito
title: 'Autorizzazione allo svolgimento di incarico retribuito'
description: '<p>Form per la richiesta di incarico retribuito</p>'
categories:
  - Docenti
elements: |-
  dati_anagrafici:
    '#type': webform_flexbox
    '#align_items': center
    markup:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
      '#markup': 'Il/La sottoscritto/a<br />&nbsp;'
    cognome:
      '#type': textfield
      '#title': Cognome
      '#autocomplete': 'off'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#flex': 2
      '#default_value': '[current-user:field_cognome]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
    nome:
      '#type': textfield
      '#title': Nome
      '#autocomplete': 'off'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#flex': 2
      '#default_value': '[current-user:field_nome]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
    codice_fiscale:
      '#type': textfield
      '#title': 'Codice Fiscale'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#default_value': '[current-user:field_codice_fiscale]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
  flexbox:
    '#type': webform_flexbox
    '#attributes':
      style: 'margin-top: 30px'
    sede_di_servizio:
      '#type': textfield
      '#title': 'In servizio presso: '
      '#autocomplete': 'off'
      '#readonly': true
      '#flex': 3
      '#default_value': '[current-user:field_sede_di_servizio]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
    in_qualita_di_:
      '#type': textfield
      '#title': 'In qualità di: '
      '#autocomplete': 'off'
      '#readonly': true
      '#flex': 2
      '#default_value': '[current-user:field_qualifica]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
    a_tempo:
      '#type': textfield
      '#title': 'A Tempo: '
      '#autocomplete': 'off'
      '#readonly': true
      '#default_value': '[current-user:field_tipologia_incarico:entity]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
  tipologia_contratto:
    '#type': radios
    '#title': 'Tipologia contratto'
    '#options':
      'Full time': 'Full time'
      'Part-time superiore al 50% dell’orario normale': 'Part-time superiore al 50% dell’orario normale'
      'Part-time pari o inferiore al 50% dell’orario normale ': 'Part-time pari o inferiore al 50% dell’orario normale '
    '#options_display': side_by_side
    '#required': true
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
  iscrizione_albo_professionale:
    '#type': radios
    '#title': 'Iscrizione Albo Professionale e/o elenco speciale'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
  dati_albo_professionale:
    '#type': webform_flexbox
    '#states':
      visible:
        ':input[name="iscrizione_albo_professionale"]':
          value: 'Yes'
      required:
        ':input[name="iscrizione_albo_professionale"]':
          value: 'Yes'
    '#justify_content': justify-space-around
    '#align_items': center
    albo_professionale:
      '#type': textfield
      '#title': 'Albo Professionale e/o elenco speciale'
    albo_professionale_dal:
      '#type': date
      '#title': Dal
    numero_tessera:
      '#type': textfield
      '#title': 'Numero tessera'
    ordine_regionale_provinciale:
      '#type': textfield
      '#title': "Presso l'ordine regionale/provinciale di"
  processed_text:
    '#type': processed_text
    '#text': '<p class="text-align-center"><strong>CHIEDE</strong></p><p>ai sensi dell’art. 508 del D.Lgs 297/94, per l’anno scolastico in corso, l’autorizzazione per il seguente incarico retribuito:</p>'
    '#format': bootstrap_italia_2
  periodo_e_qualita:
    '#type': webform_flexbox
    '#attributes':
      style: 'margin-top: 50px'
    data_inizio:
      '#type': date
      '#title': Dal
      '#required': true
      '#date_date_format': ''
    al:
      '#type': date
      '#title': Al
      '#required': true
      '#date_date_format': ''
    in_qualita_di:
      '#type': textfield
      '#title': 'in qualità di'
      '#required': true
  dati_conferimento:
    '#type': webform_flexbox
    conferito_da:
      '#type': textfield
      '#title': 'conferito da'
      '#required': true
    conferito_da_codice_fiscale:
      '#type': textfield
      '#title': 'Codice fiscale'
      '#required': true
    partita_iva:
      '#type': textfield
      '#title': 'Partita iva'
      '#required': true
  dati_conferimento_1:
    '#type': webform_flexbox
    sede_legale:
      '#type': textfield
      '#title': 'Sede legale'
      '#required': true
      '#flex': 2
    mail_ditta_pa:
      '#type': email
      '#title': 'mail ditta/pa'
      '#required': true
  dati_conferimento_2:
    '#type': webform_flexbox
    descrizione_attivita:
      '#type': textfield
      '#title': 'Descrizione attività'
      '#required': true
      '#flex': 3
    importo_presunto:
      '#type': number
      '#title': 'Importo presunto'
      '#required': true
      '#min': 0
    ammontare_ore:
      '#type': number
      '#title': 'Ammontare ore'
      '#required': true
      '#min': 0
  processed_text_01:
    '#type': processed_text
    '#text': '<p class="text-align-center"><strong>DICHIARA CHE</strong></p>'
    '#format': bootstrap_italia_2
  dichiarazione_di_conferibilita_all_esercizio:
    '#type': checkboxes
    '#title': "Dichiarazione di conferibilità all'esercizio"
    '#description': |-
      <blockquote>
      <p><strong>l&#39;incarico non si trova in alcuna delle condizioni di inconferibilit&agrave; e incompatibilit&agrave; di cui al decreto legislativo 8 aprile 2013, n. 39 &ldquo;Disposizioni in materia di inconferibilit&agrave; e incompatibilit&agrave; di incarichi presso le pubbliche amministrazioni e presso gli enti privati in controllo pubblico, a norma dell&rsquo;art. 1, commi 49 e 50, della legge 6 novembre 2012, n. 190&rdquo;;</strong></p>
      </blockquote>
    '#description_display': before
    '#options':
      si: Conferma
    '#required': true
  dichiarazione_di_compatibilita_all_esercizio:
    '#type': checkboxes
    '#title': "Dichiarazione di compatibilità all'esercizio"
    '#description': |-
      <blockquote>
      <p><strong>L&#39;incarico non sar&agrave; in alcun modo di alcun pregiudizio all&#39;assolvimento di tutti i miei obblighi di lavoro, ivi comprese eventuali attivit&agrave; aggiuntive e sar&agrave; pienamente compatibile con l&#39;orario di insegnamento, di servizio e complessivamente con tutte le attivit&agrave; della scuola.</strong></p>
      </blockquote>
    '#description_display': before
    '#options':
      si: Conferma
    '#required': true
  impegno_di_comunicazione_compensi:
    '#type': checkboxes
    '#title': 'Impegno di comunicazione compensi '
    '#description': |-
      <blockquote>
      <p><strong>dichiaro di comunicare tempestivamente la certificazione dei compensi percepiti per ogni singolo contratto/incarico </strong></p>
      </blockquote>
    '#description_display': before
    '#options':
      si: Conferma
    '#required': true
  impegno_di_comunicazione_variazione_stato:
    '#type': checkboxes
    '#title': 'Impegno di comunicazione variazione stato'
    '#description': |-
      <blockquote>
      <p><strong>Mi impegno formalmente a comunicare tempestivamentea per iscritto a codesta dirigenza ogni eventuale variazione di tipologia e caratteristiche rispetto a quelle caratterizzaanti la presente richiesta di autorizzazione. </strong></p>
      </blockquote>
    '#description_display': before
    '#options':
      si: Conferma
    '#required': true
  impegno_di_invio_contratto_incarico:
    '#type': checkboxes
    '#title': 'Impegno di invio contratto/incarico'
    '#description': |-
      <blockquote>
      <p><strong>dichiaro di inviare copia di ogni singolo contratto/incarico tempestivamente </strong></p>
      </blockquote>
    '#description_display': before
    '#options':
      si: Conferma
    '#required': true
  note:
    '#type': textarea
    '#title': 'Inserire eventuali note aggiuntive'
    '#attributes':
      style: 'margin-top: 20px'
    '#label_attributes':
      style: 'margin-top: 20px'
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
  data_firma:
    '#type': webform_flexbox
    '#attributes':
      style: 'margin-top: 30px'
    data_compilazione:
      '#type': date
      '#title': 'Data compilazione'
      '#title_display': inline
      '#disabled': true
      '#default_value': today
      '#format': bootstrap_italia_short_date
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
      '#access_view_roles':
        - authenticated
      '#date_date_format': ''
    firma_digitale:
      '#type': textarea
      '#title': FIRMA
      '#rows': 3
      '#disabled': true
      '#flex': 0
      '#default_value': |-
        [current-user:field_cognome] [current-user:field_nome]
        C.F. [current-user:field_codice_fiscale]
        E-mail: [current-user:mail]
      '#format': raw
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
        - direttore
      '#access_view_roles':
        - authenticated
  file_pdf:
    '#type': 'webform_entity_print_attachment:pdf'
    '#title': 'File PDF'
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
    '#display_on': view
    '#filename': '[webform_submission:source-title]_[webform_submission:values:cognome]_[webform_submission:values:nome].pdf'
  istituto:
    '#type': hidden
    '#title': Istituto
    '#default_value': '[site:name]'
  mail_istituto:
    '#type': hidden
    '#title': 'Mail Istituto'
    '#default_value': '[entypa:mail-istituto]'
  mail_user:
    '#type': hidden
    '#title': 'Mail user'
    '#default_value': '[current-user:mail]'
  richiesta_annullamento:
    '#type': number
    '#title': 'Richiesta Annullamento'
    '#default_value': '0'
    '#access': false
