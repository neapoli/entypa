css: ''
javascript: "(function ($) {\r\n  'use strict';\r\n\r\n  /* ---------- utility ---------- */\r\n\r\n  function toMinuti(valore) {\r\n    if (!valore) { return null; }\r\n    var p = valore.split(':');\r\n    var h = parseInt(p[0], 10);\r\n    var m = parseInt(p[1], 10);\r\n    if (isNaN(h) || isNaN(m)) { return null; }\r\n    return h * 60 + m;\r\n  }\r\n\r\n  function formatta(minuti) {\r\n    var h = Math.floor(minuti / 60);\r\n    var m = minuti % 60;\r\n    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;\r\n  }\r\n\r\n  function toData(valore) {\r\n    if (!valore) { return null; }\r\n    // input type=\"date\" → \"YYYY-MM-DD\", confrontabile come stringa\r\n    if (/^\\d{4}-\\d{2}-\\d{2}$/.test(valore)) { return valore; }\r\n    // eventuale datepicker con formato gg/mm/aaaa\r\n    var m = valore.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\r\n    if (m) {\r\n      return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);\r\n    }\r\n    return null;\r\n  }\r\n\r\n  /* ---------- calcolo totale ore ---------- */\r\n\r\n  function calcola($campo) {\r\n    var prefisso = $campo.attr('name').replace(/_(dalle|alle)_ore$/, '');\r\n    var $form = $campo.closest('form');\r\n    var $alle = $form.find('[name=\"' + prefisso + '_alle_ore\"]');\r\n    var $tot  = $form.find('[name=\"' + prefisso + '_totale_ore\"]');\r\n\r\n    if (!$tot.length) { return; }\r\n\r\n    var dalle = toMinuti($form.find('[name=\"' + prefisso + '_dalle_ore\"]').val());\r\n    var alle  = toMinuti($alle.val());\r\n\r\n    if ($alle[0] && $alle[0].setCustomValidity) {\r\n      $alle[0].setCustomValidity('');\r\n    }\r\n\r\n    if (dalle === null || alle === null) {\r\n      $tot.val('');\r\n      return;\r\n    }\r\n\r\n    var diff = alle - dalle;\r\n\r\n    if (diff <= 0) {\r\n      $tot.val('');\r\n      if ($alle[0] && $alle[0].setCustomValidity) {\r\n        $alle[0].setCustomValidity(\"L'ora di fine deve essere successiva all'ora di inizio.\");\r\n      }\r\n      return;\r\n    }\r\n\r\n    $tot.val(formatta(diff));\r\n  }\r\n\r\n  /* ---------- controllo date ---------- */\r\n\r\n  function controllaDate($campo) {\r\n    var $form = $campo.closest('form');\r\n    var $prev = $form.find('[name=\"turno_previsto_giorno\"]');\r\n    var $mod  = $form.find('[name=\"turno_modificato_giorno\"]');\r\n\r\n    if (!$prev.length || !$mod.length) { return; }\r\n\r\n    var prev = toData($prev.val());\r\n    var mod  = toData($mod.val());\r\n    var errore = '';\r\n\r\n    if (prev && mod && prev > mod) {\r\n      errore = \"La data del turno modificato non può essere precedente a quella del turno previsto.\";\r\n    }\r\n\r\n    if ($mod[0] && $mod[0].setCustomValidity) {\r\n      $mod[0].setCustomValidity(errore);\r\n    }\r\n  }\r\n\r\n  /* ---------- eventi ---------- */\r\n\r\n  $(document).on(\r\n    'change.turniOre input.turniOre',\r\n    '[name$=\"_dalle_ore\"], [name$=\"_alle_ore\"]',\r\n    function () {\r\n      calcola($(this));\r\n    }\r\n  );\r\n\r\n  $(document).on(\r\n    'change.turniData',\r\n    '[name=\"turno_previsto_giorno\"], [name=\"turno_modificato_giorno\"]',\r\n    function () {\r\n      controllaDate($(this));\r\n    }\r\n  );\r\n\r\n}(jQuery));"
