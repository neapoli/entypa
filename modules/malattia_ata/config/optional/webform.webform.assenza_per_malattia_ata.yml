css: ''
javascript: "(function ($) {\r\n  'use strict';\r\n\r\n  function toData(valore) {\r\n    if (!valore) { return null; }\r\n    var m = valore.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\r\n    if (m) { return Date.UTC(+m[1], +m[2] - 1, +m[3]); }\r\n    m = valore.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\r\n    if (m) { return Date.UTC(+m[3], +m[2] - 1, +m[1]); }\r\n    return null;\r\n  }\r\n\r\n  function controllo($campo) {\r\n    var $form   = $campo.closest('form');\r\n    var $inizio = $form.find('[name=\"data_inizio\"]');\r\n    var $fine   = $form.find('[name=\"data_fine\"]');\r\n    var $giorni = $form.find('[name=\"numero_giorni\"]');\r\n\r\n    if (!$giorni.length) { return; }\r\n\r\n    var dInizio = toData($inizio.val());\r\n    var dFine   = toData($fine.val());\r\n    var errore  = '';\r\n\r\n    if (dInizio === null || dFine === null) {\r\n      $giorni.val('');\r\n    }\r\n    else if (dFine < dInizio) {\r\n      $giorni.val('');\r\n      errore = \"La data di fine non può precedere quella di inizio.\";\r\n    }\r\n    else {\r\n      $giorni.val(Math.round((dFine - dInizio) / 86400000) + 1);\r\n    }\r\n\r\n    if ($fine[0] && $fine[0].setCustomValidity) {\r\n      $fine[0].setCustomValidity(errore);\r\n    }\r\n  }\r\n\r\n  $(document).on(\r\n    'change.giorniSingolo input.giorniSingolo',\r\n    '[name=\"data_inizio\"], [name=\"data_fine\"]',\r\n    function () {\r\n      controllo($(this));\r\n    }\r\n  );\r\n\r\n}(jQuery));"
