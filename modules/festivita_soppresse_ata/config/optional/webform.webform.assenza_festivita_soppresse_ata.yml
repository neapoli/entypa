id: assenza_festivita_soppresse_ata
title: 'Festività soppresse (L.937/77) - ATA'
description: '<p>Form per la richiesta di assenza per festività soppresse ATA</p>'
categories:
  - Ata
elements: |-
  dati_anagrafici:
    '#type': webform_flexbox
    '#align_items': center
    markup:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#markup': 'Il/La sottoscritto/a'
    cognome:
      '#type': textfield
      '#title': Cognome
      '#autocomplete': 'off'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#flex': 2
      '#default_value': '[current-user:field_cognome]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
    nome:
      '#type': textfield
      '#title': Nome
      '#autocomplete': 'off'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#flex': 2
      '#default_value': '[current-user:field_nome]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
    codice_fiscale:
      '#type': textfield
      '#title': 'Codice Fiscale'
      '#readonly': true
      '#input_mask': "'casing': 'upper'"
      '#default_value': '[current-user:field_codice_fiscale]'
      '#format_items': comma
  flexbox:
    '#type': webform_flexbox
    '#attributes':
      style: 'margin-top: 30px'
    sede_di_servizio:
      '#type': textfield
      '#title': 'In servizio presso: '
      '#autocomplete': 'off'
      '#readonly': true
      '#flex': 3
      '#default_value': '[current-user:field_sede_di_servizio]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
    in_qualita_di_:
      '#type': textfield
      '#title': 'In qualità di: '
      '#autocomplete': 'off'
      '#readonly': true
      '#flex': 2
      '#default_value': '[current-user:field_qualifica]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
    a_tempo:
      '#type': textfield
      '#title': 'A Tempo: '
      '#autocomplete': 'off'
      '#readonly': true
      '#default_value': '[current-user:field_tipologia_incarico:entity]'
      '#format_items': comma
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
  processed_text:
    '#type': processed_text
    '#access_create_roles':
      - authenticated
    '#access_update_roles':
      - authenticated
    '#access_view_roles':
      - authenticated
    '#text': |
      <p>Con riferimento all’art. 18 del CCNL del 6.7.1995, all’art. 28, comma 6, del CCNL 21/05/2018, agli effetti della legge 937/1977,</p>

      <div class="text-align-center"><strong>CHIEDE</strong></div>

      <p>di poter usufruire dei seguenti giorni di festività soppresse:</p>
    '#format': bootstrap_italia_2
  periodi_richiesti:
    '#type': webform_custom_composite
    '#title': 'Periodi richiesti'
    '#required': true
    '#multiple__sorting': false
    '#multiple__add_more': false
    '#multiple__add_more_input': false
    '#format_items': table
    '#element':
      data_inizio:
        '#type': date
        '#required': true
        '#title': 'Data inizio'
        '#format': bootstrap_italia_short_date
      data_fine:
        '#type': date
        '#required': true
        '#title': 'Data fine'
        '#format': bootstrap_italia_short_date
      numero_giorni:
        '#type': textfield
        '#title': 'Numero giorni'
        '#readonly': true
        '#size': 6
        '#attributes':
          readonly: readonly
          class:
            - numero-giorni-row
  totale_giorni:
    '#type': textfield
    '#title': 'Totale giorni'
    '#size': 12
    '#readonly': true
  note:
    '#type': textarea
    '#title': 'Inserire eventuali note aggiuntive'
    '#attributes':
      style: 'margin-top: 20px'
    '#label_attributes':
      style: 'margin-top: 20px'
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
  data_firma:
    '#type': webform_flexbox
    '#attributes':
      style: 'margin-top: 30px'
    data_compilazione:
      '#type': date
      '#title': 'Data compilazione'
      '#title_display': inline
      '#disabled': true
      '#default_value': today
      '#format': bootstrap_italia_short_date
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#date_date_format': ''
    firma_digitale:
      '#type': textarea
      '#title': FIRMA
      '#rows': 3
      '#disabled': true
      '#flex': 0
      '#default_value': |-
        [current-user:field_cognome] [current-user:field_nome]
        C.F. [current-user:field_codice_fiscale]
        E-mail: [current-user:mail]
      '#format': raw
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - administrator
        - dirigente
        - direttore
      '#access_view_roles':
        - authenticated
  file_pdf:
    '#type': 'webform_entity_print_attachment:pdf'
    '#title': 'File PDF'
    '#access_create_roles':
      - authenticated
    '#access_update_roles': {  }
    '#access_view_roles':
      - authenticated
    '#display_on': view
    '#filename': '[webform_submission:source-title]_[webform_submission:values:cognome]_[webform_submission:values:nome].pdf'
    '#sanitize': true
  istituto:
    '#type': hidden
    '#title': Istituto
    '#default_value': '[site:name]'
  mail_istituto:
    '#type': hidden
    '#title': 'Mail Istituto'
    '#default_value': info@softwebadvice.com
  mail_user:
    '#type': hidden
    '#title': 'Mail user'
    '#default_value': '[current-user:mail]'
  richiesta_annullamento:
    '#type': number
    '#title': 'Richiesta Annullamento'
    '#default_value': '0'
    '#access': false
css: ''
javascript: "(function ($, Drupal) {\r\n  'use strict';\r\n\r\n  var SEL_DATE = 'input[name*=\"[data_inizio]\"], input[name*=\"[data_fine]\"]';\r\n  var SEL_PESO = 'select[name*=\"[weight]\"]';\r\n  var SEL_FORM = '[class*=\"webform-submission-assenza-festivita-soppresse-ata\"]';\r\n\r\n  function toData(valore) {\r\n    if (!valore) { return null; }\r\n    var m = valore.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\r\n    if (m) { return Date.UTC(+m[1], +m[2] - 1, +m[3]); }\r\n    m = valore.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\r\n    if (m) { return Date.UTC(+m[3], +m[2] - 1, +m[1]); }\r\n    return null;\r\n  }\r\n\r\n  function prefissoRiga(name) {\r\n    return name.replace(/\\[[^\\[\\]]*\\]$/, '');\r\n  }\r\n\r\n  function campo($form, prefisso, chiave) {\r\n    return $form.find('[name=\"' + prefisso + '[' + chiave + ']\"]');\r\n  }\r\n\r\n  function errore($campo, testo) {\r\n    if ($campo[0] && $campo[0].setCustomValidity) {\r\n      $campo[0].setCustomValidity(testo);\r\n    }\r\n  }\r\n\r\n  // Passaggio completo: ricalcola i giorni, valida la sequenza, somma il totale.\r\n  function validaForm($form) {\r\n    var totale = 0;\r\n    var finePrecedente = null;\r\n\r\n    $form.find('input[name*=\"[data_inizio]\"]').each(function (indice) {\r\n      var p       = prefissoRiga(this.name);\r\n      var $inizio = campo($form, p, 'data_inizio');\r\n      var $fine   = campo($form, p, 'data_fine');\r\n      var $giorni = campo($form, p, 'numero_giorni');\r\n\r\n      var dInizio = toData($inizio.val());\r\n      var dFine   = toData($fine.val());\r\n\r\n      var errInizio = '';\r\n      var errFine   = '';\r\n\r\n      // 1. La riga deve iniziare dopo la fine della riga precedente.\r\n      if (dInizio !== null && finePrecedente !== null && dInizio <= finePrecedente) {\r\n        errInizio = 'Il periodo ' + (indice + 1) +\r\n          ' deve iniziare dopo la fine del periodo precedente.';\r\n      }\r\n\r\n      // 2. Fine >= inizio (inizio == fine significa un giorno solo).\r\n      if (dInizio !== null && dFine !== null && dFine < dInizio) {\r\n        errFine = 'La data di fine non può precedere quella di inizio.';\r\n      }\r\n      // 3. Caso limite: inizio vuoto ma fine compilata.\r\n      else if (dInizio === null && dFine !== null &&\r\n               finePrecedente !== null && dFine <= finePrecedente) {\r\n        errFine = 'Il periodo ' + (indice + 1) +\r\n          ' deve terminare dopo la fine del periodo precedente.';\r\n      }\r\n\r\n      errore($inizio, errInizio);\r\n      errore($fine, errFine);\r\n\r\n      if (dInizio !== null && dFine !== null && !errInizio && !errFine) {\r\n        var giorni = Math.round((dFine - dInizio) / 86400000) + 1;\r\n        $giorni.val(giorni);\r\n        totale += giorni;\r\n      }\r\n      else {\r\n        $giorni.val('');\r\n      }\r\n\r\n      // Riferimento per la riga successiva: solo se questa riga è valida.\r\n      if (dFine !== null && !errInizio && !errFine) {\r\n        finePrecedente = dFine;\r\n      }\r\n    });\r\n\r\n    $form.find('input[name=\"totale_giorni\"]').val(totale || '');\r\n  }\r\n\r\n  $(document).on('change.ferieGiorni input.ferieGiorni', SEL_DATE, function () {\r\n    var $form = $(this).closest(SEL_FORM);\r\n    if ($form.length) { validaForm($form); }\r\n  });\r\n\r\n  // Riordino delle righe via drag & drop: cambia l'ordine, va rivalidato.\r\n  $(document).on('change.ferieGiorni', SEL_PESO, function () {\r\n    var $form = $(this).closest(SEL_FORM);\r\n    if ($form.length) { validaForm($form); }\r\n  });\r\n\r\n  // Aggiunta / rimozione righe del composite.\r\n  $(document).on('ajaxComplete.ferieGiorni', function () {\r\n    $(SEL_FORM).each(function () {\r\n      validaForm($(this));\r\n    });\r\n  });\r\n\r\n  Drupal.behaviors.ferieEstiveDocGiorni = {\r\n    attach: function (context) {\r\n      $(context).find(SEL_FORM).addBack(SEL_FORM).each(function () {\r\n        validaForm($(this));\r\n      });\r\n    }\r\n  };\r\n\r\n})(jQuery, Drupal);"
