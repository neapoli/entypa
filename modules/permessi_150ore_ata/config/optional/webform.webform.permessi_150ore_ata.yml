css: ".referenti-plesso {\r\n  visibility: hidden;\r\n}"
javascript: "(function ($, Drupal) {\r\n  'use strict';\r\n\r\n  var SEL_ORE = 'input[name*=\"permesso_orario\"][name*=\"[ora_inizio]\"], ' +\r\n                'input[name*=\"permesso_orario\"][name*=\"[ora_fine]\"]';\r\n  var SEL_GIORNO = 'input[name*=\"permesso_orario\"][name*=\"[giorno]\"]';\r\n  var SEL_PESO   = 'select[name*=\"permesso_orario\"][name*=\"[weight]\"]';\r\n\r\n  function toMinuti(valore) {\r\n    if (!valore) { return null; }\r\n    var p = valore.split(':');\r\n    var h = parseInt(p[0], 10);\r\n    var m = parseInt(p[1], 10);\r\n    if (isNaN(h) || isNaN(m)) { return null; }\r\n    return h * 60 + m;\r\n  }\r\n\r\n  function toData(valore) {\r\n    if (!valore) { return null; }\r\n    var m = valore.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\r\n    if (m) { return Date.UTC(+m[1], +m[2] - 1, +m[3]); }\r\n    m = valore.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\r\n    if (m) { return Date.UTC(+m[3], +m[2] - 1, +m[1]); }\r\n    return null;\r\n  }\r\n\r\n  function formatOre(min) {\r\n    var h = Math.floor(min / 60);\r\n    var m = min % 60;\r\n    return h + 'h' + (m ? ' ' + m + 'min' : '');\r\n  }\r\n\r\n  function prefissoRiga(name) {\r\n    return name.replace(/\\[[^\\[\\]]*\\]$/, '');\r\n  }\r\n\r\n  function campo($form, prefisso, chiave) {\r\n    return $form.find('[name=\"' + prefisso + '[' + chiave + ']\"]');\r\n  }\r\n\r\n  function errore($campo, testo) {\r\n    if ($campo[0] && $campo[0].setCustomValidity) {\r\n      $campo[0].setCustomValidity(testo);\r\n    }\r\n  }\r\n\r\n  function validaForm($form) {\r\n    var totale = 0;\r\n    var giornoPrecedente = null;\r\n\r\n    $form.find(SEL_GIORNO).each(function (indice) {\r\n      var p       = prefissoRiga(this.name);\r\n      var $giorno = campo($form, p, 'giorno');\r\n      var $inizio = campo($form, p, 'ora_inizio');\r\n      var $fine   = campo($form, p, 'ora_fine');\r\n      var $tot    = campo($form, p, 'totale_ore');\r\n\r\n      var dGiorno = toData($giorno.val());\r\n      var inizio  = toMinuti($inizio.val());\r\n      var fine    = toMinuti($fine.val());\r\n\r\n      var errGiorno = '';\r\n      var errFine   = '';\r\n\r\n      // 1. Il giorno deve essere successivo a quello della riga precedente.\r\n      if (dGiorno !== null && giornoPrecedente !== null && dGiorno <= giornoPrecedente) {\r\n        errGiorno = 'Il giorno della riga ' + (indice + 1) +\r\n          ' deve essere successivo a quello della riga precedente.';\r\n      }\r\n\r\n      // 2. Ora fine successiva a ora inizio.\r\n      if (inizio !== null && fine !== null && fine <= inizio) {\r\n        errFine = \"L'ora di fine deve essere successiva all'ora di inizio.\";\r\n      }\r\n\r\n      errore($giorno, errGiorno);\r\n      errore($fine, errFine);\r\n\r\n      if (inizio !== null && fine !== null && !errGiorno && !errFine) {\r\n        $tot.val(formatOre(fine - inizio));\r\n        totale += fine - inizio;\r\n      }\r\n      else {\r\n        $tot.val('');\r\n      }\r\n\r\n      // Riferimento per la riga successiva: solo se questa riga è valida.\r\n      if (dGiorno !== null && !errGiorno) {\r\n        giornoPrecedente = dGiorno;\r\n      }\r\n    });\r\n\r\n    $form.find('input[name=\"per_un_totale_di_ore\"]')\r\n      .val(totale ? formatOre(totale) : '');\r\n  }\r\n\r\n  function formConPermessi(context) {\r\n    return $(context).find('form').addBack('form').has(SEL_GIORNO);\r\n  }\r\n\r\n  $(document).on('change.permessiOre input.permessiOre',\r\n    SEL_ORE + ', ' + SEL_GIORNO, function () {\r\n      var $form = $(this).closest('form');\r\n      if ($form.length) { validaForm($form); }\r\n    });\r\n\r\n  // Riordino righe via drag & drop.\r\n  $(document).on('change.permessiOre', SEL_PESO, function () {\r\n    var $form = $(this).closest('form');\r\n    if ($form.length) { validaForm($form); }\r\n  });\r\n\r\n  // Aggiunta / rimozione righe del composite.\r\n  $(document).on('ajaxComplete.permessiOre', function () {\r\n    formConPermessi(document).each(function () {\r\n      validaForm($(this));\r\n    });\r\n  });\r\n\r\n  Drupal.behaviors.permessiOrariTotale = {\r\n    attach: function (context) {\r\n      formConPermessi(context).each(function () {\r\n        validaForm($(this));\r\n      });\r\n    }\r\n  };\r\n\r\n}(jQuery, Drupal));"
